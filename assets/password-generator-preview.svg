<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Password Generator preview</title>
  <desc id="desc">Dark desktop app mockup with a masked sample password, length slider, and generate and copy buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/>
  <circle cx="1010" cy="104" r="200" fill="#f97316" opacity=".07"/>
  <circle cx="145" cy="610" r="240" fill="#f97316" opacity=".04"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(106 88)">
      <rect width="52" height="52" rx="16" fill="#27272a" stroke="#3f3f46"/>
      <path d="M19 23v-4a7 7 0 0 1 14 0v4m-17 0h20v17H16z" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="26" cy="31" r="2" fill="#fb923c"/>
      <path d="M26 33v3" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
      <text x="72" y="22" fill="#a1a1aa" font-size="14" font-weight="700" letter-spacing="2.2">A SMALL, PRIVATE UTILITY</text>
      <text x="72" y="49" fill="#fafafa" font-size="24" font-weight="650">PASSWORD GENERATOR</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="268" y="176" width="664" height="446" rx="24" fill="#18181b" stroke="#3f3f46"/>
      <path d="M292 176h616a24 24 0 0 1 24 24v28H268v-28a24 24 0 0 1 24-24z" fill="#202024"/>
      <circle cx="296" cy="202" r="5" fill="#f97316"/>
      <circle cx="315" cy="202" r="5" fill="#52525b"/>
      <circle cx="334" cy="202" r="5" fill="#52525b"/>
      <text x="600" y="207" text-anchor="middle" fill="#a1a1aa" font-size="13">Password Generator</text>

      <text x="326" y="278" fill="#fb923c" font-size="12" font-weight="700" letter-spacing="2">PASSWORD GENERATOR</text>
      <text x="326" y="319" fill="#fafafa" font-size="27" font-weight="650">Create a strong password</text>
      <text x="326" y="347" fill="#a1a1aa" font-size="15">Random letters and numbers, generated on your device.</text>

      <rect x="326" y="377" width="548" height="67" rx="12" fill="#27272a" stroke="#3f3f46"/>
      <text x="600" y="420" text-anchor="middle" fill="#e4e4e7" font-size="23" letter-spacing="5">••••••••••••••••</text>

      <text x="326" y="485" fill="#e4e4e7" font-size="15">Length</text>
      <text x="874" y="485" text-anchor="end" fill="#fb923c" font-size="15" font-weight="700">16</text>
      <rect x="326" y="503" width="548" height="6" rx="3" fill="#3f3f46"/>
      <rect x="326" y="503" width="82" height="6" rx="3" fill="url(#accent)"/>
      <circle cx="408" cy="506" r="10" fill="#fb923c" stroke="#18181b" stroke-width="3"/>
      <text x="600" y="540" text-anchor="middle" fill="#a1a1aa" font-size="12">Preview only — no sample password is shown.</text>

      <rect x="326" y="560" width="392" height="42" rx="10" fill="url(#accent)"/>
      <text x="522" y="587" text-anchor="middle" fill="#18181b" font-size="14" font-weight="700">Generate new password</text>
      <rect x="730" y="560" width="144" height="42" rx="10" fill="#27272a" stroke="#52525b"/>
      <text x="802" y="587" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="650">Copy</text>
    </g>

    <text x="600" y="666" text-anchor="middle" fill="#71717a" font-size="14">Same polished app on Windows and Linux · Secure randomness · Nothing saved or sent</text>
  </g>
</svg>
