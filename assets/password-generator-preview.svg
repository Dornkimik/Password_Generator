<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Password Generator application preview</title>
  <desc id="desc">Preview of the desktop password generator with password length, character group, and ambiguous character settings.</desc>
  <rect width="1000" height="720" rx="18" fill="#18181b"/>
  <rect x="1" y="1" width="998" height="718" rx="17" fill="none" stroke="#3f3f46"/>
  <path d="M18 1h964a17 17 0 0 1 17 17v38H1V18A17 17 0 0 1 18 1z" fill="#202024"/>
  <circle cx="28" cy="28" r="5" fill="#71717a"/>
  <circle cx="48" cy="28" r="5" fill="#71717a"/>
  <circle cx="68" cy="28" r="5" fill="#71717a"/>
  <text x="500" y="33" text-anchor="middle" fill="#d4d4d8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Password Generator</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="88" y="112" fill="#f97316" font-size="12" font-weight="700" letter-spacing="1.6">PASSWORD GENERATOR</text>
    <text x="88" y="148" fill="#fafafa" font-size="25" font-weight="600">Create a strong password</text>
    <text x="88" y="174" fill="#a1a1aa" font-size="14">Choose what goes into your password. Generated on your device.</text>

    <rect x="88" y="201" width="824" height="66" rx="10" fill="#27272a" stroke="#3f3f46"/>
    <text x="500" y="242" text-anchor="middle" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" letter-spacing="4">••••••••••••••••</text>

    <text x="88" y="307" fill="#e4e4e7" font-size="14">Length</text>
    <text x="912" y="307" text-anchor="end" fill="#f97316" font-size="14" font-weight="700">16</text>
    <rect x="88" y="321" width="824" height="5" rx="2.5" fill="#3f3f46"/>
    <rect x="88" y="321" width="112" height="5" rx="2.5" fill="#f97316"/>
    <circle cx="200" cy="323.5" r="9" fill="#f97316" stroke="#18181b" stroke-width="3"/>

    <text x="88" y="367" fill="#fafafa" font-size="15" font-weight="600">Include characters</text>
    <g fill="#e4e4e7" font-size="14">
      <rect x="90" y="386" width="16" height="16" rx="3" fill="#f97316"/><path d="m94 394 3 3 6-7" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="116" y="399">Uppercase (A–Z)</text>
      <rect x="500" y="386" width="16" height="16" rx="3" fill="#f97316"/><path d="m504 394 3 3 6-7" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="526" y="399">Lowercase (a–z)</text>

      <rect x="90" y="417" width="16" height="16" rx="3" fill="#f97316"/><path d="m94 425 3 3 6-7" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="116" y="430">Numbers (0–9)</text>
      <rect x="500" y="417" width="16" height="16" rx="3" fill="#27272a" stroke="#71717a"/>
      <text x="526" y="430">Symbols (!@#…)</text>

      <rect x="90" y="451" width="16" height="16" rx="3" fill="#27272a" stroke="#71717a"/>
      <text x="116" y="464">Avoid ambiguous characters (0, O, l, 1)</text>
    </g>

    <rect x="88" y="508" width="824" height="1" fill="#3f3f46"/>
    <rect x="88" y="536" width="600" height="52" rx="8" fill="#f97316"/>
    <text x="388" y="568" text-anchor="middle" fill="#18181b" font-size="14" font-weight="700">Generate new password</text>
    <rect x="702" y="536" width="210" height="52" rx="8" fill="#27272a" stroke="#52525b"/>
    <text x="807" y="568" text-anchor="middle" fill="#fafafa" font-size="14" font-weight="600">Copy</text>
  </g>
</svg>
